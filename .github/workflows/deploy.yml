name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# OIDC — short-lived tokens only. No AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# should exist as repository secrets. If they do, delete them from
# Settings → Secrets and variables → Actions.
permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

# ── Config sources ────────────────────────────────────────────────────────────
# GitHub secret (only one — needed to authenticate before any AWS call):
#   AWS_DEPLOY_ROLE_ARN   arn:aws:iam::757953088569:role/iai-legal-demo-github-actions
#
# Deploy targets (frontend bucket, lambda bucket, CloudFront ID) are read at
# deploy time from AWS Secrets Manager: secret `iai-legal-demo/deploy-config`
# (provisioned in terraform/secrets.tf; role granted read in terraform/iam.tf).
#
# Public build config (API/APP/MCP URLs) lives in frontend/.env.production.

jobs:
  # ── 1. Test ─────────────────────────────────────────────────────────────────
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest services/ -v --tb=short

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  # ── 2. Detect what changed ───────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'requirements*.txt'
              - 'build_lambda.sh'
              - 'mcp_server.py'
            frontend:
              - 'frontend/**'

  # ── 3. Deploy Lambda (CD — main branch only, tests must pass) ───────────────
  deploy-backend:
    name: Deploy Lambda
    needs: [test-python, test-frontend, changes]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Lambda ZIPs
        run: bash build_lambda.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Load deploy config from Secrets Manager
        run: |
          CFG=$(aws secretsmanager get-secret-value \
            --secret-id iai-legal-demo/deploy-config \
            --query SecretString --output text)
          echo "LAMBDA_BUCKET=$(echo "$CFG" | jq -r .lambda_bucket)" >> "$GITHUB_ENV"

      - name: Upload ZIPs to Lambda artifacts bucket
        run: |
          aws s3 cp api_lambda.zip    s3://$LAMBDA_BUCKET/api_lambda.zip
          aws s3 cp ai_lambda.zip     s3://$LAMBDA_BUCKET/ai_lambda.zip
          aws s3 cp mcp_lambda.zip    s3://$LAMBDA_BUCKET/mcp_lambda.zip
          aws s3 cp ingest_lambda.zip s3://$LAMBDA_BUCKET/ingest_lambda.zip

      - name: Update Lambda function code
        run: |
          for fn in api ai mcp ingest; do
            aws lambda update-function-code \
              --function-name iai-legal-demo-$fn \
              --s3-bucket $LAMBDA_BUCKET \
              --s3-key ${fn}_lambda.zip \
              --output text
          done

  # ── 4. Deploy Frontend (CD — main branch only, tests must pass) ─────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: [test-python, test-frontend, changes]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The `postbuild` step pre-renders the landing page with Playwright to
      # kill the CSR flash, so CI needs the chromium browser + its OS deps.
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build (Vite → frontend/dist, prod config from .env.production)
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Load deploy config from Secrets Manager
        run: |
          CFG=$(aws secretsmanager get-secret-value \
            --secret-id iai-legal-demo/deploy-config \
            --query SecretString --output text)
          echo "FRONTEND_BUCKET=$(echo "$CFG" | jq -r .frontend_bucket)" >> "$GITHUB_ENV"
          echo "CF_DIST_ID=$(echo "$CFG" | jq -r .cf_dist_id)" >> "$GITHUB_ENV"

      - name: Upload hashed assets to S3 (immutable, long cache)
        run: |
          aws s3 sync frontend/dist/ s3://$FRONTEND_BUCKET/ --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

      - name: Upload index.html (no cache, correct content-type)
        run: |
          aws s3 cp frontend/dist/index.html s3://$FRONTEND_BUCKET/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CF_DIST_ID \
            --paths "/*" \
            --output text
