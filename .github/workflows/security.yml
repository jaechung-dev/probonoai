name: Security

# Defence-in-depth scanning expected of a financial-grade repo:
#   1. CodeQL      — static analysis (SAST) for JS/TS + Python
#   2. Dependencies — npm audit + pip-audit for known-vulnerable packages
#   3. Trivy       — filesystem + container image CVE scan (4 Dockerfiles)
#   4. Gitleaks    — secret scanning
# Runs on push, PR, and weekly (catches newly-disclosed CVEs in unchanged code).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read
  security-events: write # upload SARIF to the Security tab

jobs:
  # ── 1. SAST ──────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  # ── 2. Dependency vulnerabilities ────────────────────────────────────────────
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (Python services)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || true
          pip-audit -r requirements-api.txt || true

  # ── 3. Container / filesystem CVE scan ───────────────────────────────────────
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem + config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

  # ── 4. Secret scanning ───────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
