# Automated dependency updates + vulnerability alerts.
#
# Kept quiet on purpose: one grouped PR per ecosystem per month, minor/patch
# only. Major upgrades (React, TypeScript, openai, mcp, ...) need code changes
# and are done by hand. Security updates are NOT affected by `ignore` or the
# schedule: Dependabot still opens those immediately for vulnerable packages.
version: 2
updates:
  # ── Frontend (Vite / React / TS) ────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        update-types: ["minor", "patch"]

  # ── Root Node tooling ───────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      root-node:
        update-types: ["minor", "patch"]

  # ── Python services (requirements*.txt live at repo root) ───────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        update-types: ["minor", "patch"]

  # ── Container base images ───────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directories: ["/services/auth", "/services/mcp", "/services/rag", "/services/bff"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        update-types: ["minor", "patch"]

  # ── CI/CD action pins ───────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        update-types: ["minor", "patch"]
