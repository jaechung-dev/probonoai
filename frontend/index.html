<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <!-- Default SEO for the static shell. The landing route ("/") is
         pre-rendered (scripts/prerender.mjs) and react-helmet-async injects the
         richer per-page tags there; these defaults ensure any crawler that hits
         the raw shell still gets a sensible title/description/canonical. -->
    <title>ProBono AI — Free NSW legal help in plain English</title>
    <meta name="description" content="Ask about NSW law and get plain-English answers backed by real legislation and caselaw. Free legal information for everyday people — a starting point, not legal advice." />
    <link rel="canonical" href="https://www.probonoai.com.au/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProBono AI" />
    <meta property="og:title" content="ProBono AI — Free NSW legal help in plain English" />
    <meta property="og:description" content="Ask about NSW law and get plain-English answers backed by real legislation and caselaw." />
    <meta property="og:url" content="https://www.probonoai.com.au/" />
    <meta property="og:image" content="https://www.probonoai.com.au/justiti.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Boot gate: the pre-rendered markup in #root is the landing page, and it
         is served for every route. Redirect logged-in users off "/" and hide the
         stale landing on app routes so it never flashes before React renders. -->
    <style>html.booting #root{display:none !important}</style>
    <script>
      (function () {
        try {
          var p = location.pathname, s = location.search;
          var t = localStorage.getItem('iai_token'), authed = false;
          if (t) { try { authed = JSON.parse(atob(t.split('.')[1])).exp * 1000 > Date.now(); } catch (e) {} }
          if (authed && p === '/' && s.indexOf('preview') === -1) {
            // Hide the pre-rendered landing BEFORE redirecting so a logged-in
            // user never sees it flash on the way to the app.
            document.documentElement.className += ' booting';
            location.replace('/chat');
            return;
          }
          if (p !== '/') {
            document.documentElement.className += ' booting';
            setTimeout(function () { document.documentElement.classList.remove('booting'); }, 4000);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background:#09090b;margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
